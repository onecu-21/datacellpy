[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datacellpy"
version = "1.0.0"
description = "A dependency-driven dataflow runtime for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/onecu-21/datacellpy"
Issues = "https://github.com/onecu-21/datacellpy/issues"

[tool.setuptools]
packages = ["datacellpy"]
